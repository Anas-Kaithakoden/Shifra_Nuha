<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Vector favicon, with a raster fallback for browsers that ignore SVG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <!-- Cool off-white page background, so the mobile browser chrome matches the
         page on first paint rather than flashing a dark band. -->
    <meta name="theme-color" content="#f7f5ef" />

    <!-- The header logo is the largest content element on first paint. -->
    <link rel="preload" as="image" type="image/png" href="/brand/logo.png" />

    <!--
      The title, description and social tags here are the values a crawler sees
      before JavaScript runs, and the ones a link is unfurled with. They match
      `site.seoTitle` / `site.seoDescription` in `src/content/site.ts`, which
      `useDocumentMeta` then sets per route. Change both together.

      No price appears in any of them, and none may be added: there is no
      published figure anywhere on this site.
    -->
    <title>Business Registration & Digital Solutions in Kerala | Shifra Nuha Technologies</title>
    <meta
      name="description"
      content="Business registration, tax and compliance, websites and branding for businesses across Kerala. One partner from idea to launch. Talk to us on WhatsApp."
    />
    <!-- Rewritten at build time by the plugin in vite.config.ts: with no
         VITE_WEBSITE_DOMAIN this becomes "noindex, follow". It is declared
         statically so a crawler that does not run JavaScript still finds it. -->
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shifra Nuha Technologies" />
    <meta
      property="og:title"
      content="Business Registration & Digital Solutions in Kerala | Shifra Nuha Technologies"
    />
    <meta
      property="og:description"
      content="Business registration, tax and compliance, websites and branding for businesses across Kerala. One partner from idea to launch. Talk to us on WhatsApp."
    />
    <meta property="og:locale" content="en_IN" />
    <!-- Relative until VITE_WEBSITE_DOMAIN is set; useDocumentMeta upgrades it.
         The filename is versioned: /brand/* is cached for a day, and WhatsApp,
         Facebook and LinkedIn cache this URL far longer, so changed artwork
         ships under a new name or nobody sees it. See scripts/make-og-image.py. -->
    <meta property="og:image" content="/brand/og-image-v2.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Shifra Nuha Technologies logo in white on a deep navy ground, with shifranuhatech.com beneath it."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Business Registration & Digital Solutions in Kerala | Shifra Nuha Technologies"
    />
    <meta
      name="twitter:description"
      content="Business registration, tax and compliance, websites and branding for businesses across Kerala. One partner from idea to launch. Talk to us on WhatsApp."
    />
    <meta name="twitter:image" content="/brand/og-image-v2.png" />
    <meta
      name="twitter:image:alt"
      content="The Shifra Nuha Technologies logo in white on a deep navy ground, with shifranuhatech.com beneath it."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fraunces carries the editorial display voice; Inter carries the interface
         and body copy. The site is English only. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
