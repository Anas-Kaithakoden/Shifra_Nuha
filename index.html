<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Vector favicon, with a raster fallback for browsers that ignore SVG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b1220" />

    <!-- The header logo is the largest content element on first paint. -->
    <link rel="preload" as="image" type="image/png" href="/brand/logo.png" />

    <title>Shifra Nuha Technologies — Start. Build. Grow. Automate.</title>
    <meta
      name="description"
      content="Shifra Nuha Technologies helps businesses with business setup, branding, websites, marketing, automation and technology — through one coordinated team."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shifra Nuha Technologies" />
    <meta property="og:title" content="Shifra Nuha Technologies — Start. Build. Grow. Automate." />
    <meta
      property="og:description"
      content="Business setup, branding and digital presence, marketing and lead generation, and AI &amp; business automation — through one coordinated team."
    />
    <!-- Relative until site.url is set; useDocumentMeta upgrades it to absolute. -->
    <meta property="og:image" content="/brand/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Shifra Nuha Technologies — Start. Build. Grow. Automate."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shifra Nuha Technologies — Start. Build. Grow. Automate." />
    <meta
      name="twitter:description"
      content="Business setup, branding and digital presence, marketing and lead generation, and AI &amp; business automation — through one coordinated team."
    />
    <meta name="twitter:image" content="/brand/og-image.png" />
    <meta name="twitter:image:alt" content="Shifra Nuha Technologies — Start. Build. Grow. Automate." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
